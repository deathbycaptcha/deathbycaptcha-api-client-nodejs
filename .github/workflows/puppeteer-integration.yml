name: Puppeteer Integration Tests

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  puppeteer-integration:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          npm install
          npx puppeteer browsers install chrome

      - name: Check integration secrets
        id: secrets-check
        run: |
          if [ -z "${{ secrets.DBC_USERNAME }}" ] || [ -z "${{ secrets.DBC_PASSWORD }}" ]; then
            echo "missing=true" >> "$GITHUB_OUTPUT"
          else
            echo "missing=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip (missing secrets)
        if: steps.secrets-check.outputs.missing == 'true'
        run: |
          echo "DBC_USERNAME/DBC_PASSWORD are not configured in repository secrets."
          echo "Skipping puppeteer integration tests."

      - name: Run puppeteer integration tests
        if: steps.secrets-check.outputs.missing == 'false'
        env:
          DBC_USERNAME: ${{ secrets.DBC_USERNAME }}
          DBC_PASSWORD: ${{ secrets.DBC_PASSWORD }}
          DBC_PUPPETEER_HEADLESS: "true"
          DBC_TEST_CAPTCHA_URL: "https://www.google.com/recaptcha/api2/demo"
        run: node tests/integration/puppeteer.integration.test.js
