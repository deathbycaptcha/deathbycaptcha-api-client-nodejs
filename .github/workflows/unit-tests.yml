name: Unit Tests (Node 20)

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  unit_tests_node20:
    name: Unit tests Node 20
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Cache npm
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-20-npm-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-node-20-npm-

      - name: Show versions
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm install

      - name: Run unit tests
        run: npm run test:unit
